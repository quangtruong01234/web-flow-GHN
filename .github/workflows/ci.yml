name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Mirrors `npm run verify` but as separate steps so a failure names itself
      # in the job log. Order matters: tsc must not race `next build` on
      # .next/types (see .ai/context/testing.md).
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The e2e specs mock the gateway via page.route, so no backend is needed.
      # Playwright starts the dev server itself (see playwright.config.ts).
      - name: Run E2E
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    # Forked PRs cannot read secrets — skip instead of failing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Vercel secrets are optional: without them the repo still gets full CI,
      # and every deploy step below no-ops.
      - name: Check Vercel credentials
        id: guard
        run: echo "configured=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Note missing credentials
        if: steps.guard.outputs.configured != 'true'
        run: |
          echo "Vercel secrets not set — skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to enable it." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install --global vercel@latest

      # main -> production, everything else -> preview.
      - name: Resolve target environment
        id: target
        if: steps.guard.outputs.configured == 'true'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Pulls the project's env vars (API_PROXY_TARGET, NEXT_PUBLIC_*) so the
      # build below matches what Vercel would produce itself. VERCEL_TOKEN must
      # be scoped to All Projects: a project-scoped token cannot read the
      # project settings this needs, and fails here with the misleading
      # "Could not retrieve Project Settings".
      - name: Pull Vercel environment
        if: steps.guard.outputs.configured == 'true'
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.guard.outputs.configured == 'true'
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.guard.outputs.configured == 'true'
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.env }}): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.guard.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deploy: ${{ steps.deploy.outputs.url }}`,
            });
